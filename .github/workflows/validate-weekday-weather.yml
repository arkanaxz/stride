name: Verify weekday and weather autofill
on:
  push:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/history-weekday-weather.test.mjs
      - run: node --test tests/chart-mileage.test.mjs
      - run: npm run build
