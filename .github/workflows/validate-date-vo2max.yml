name: Validate Date-first and Garmin VO2 max
on:
  push:
    branches: [feat/date-first-garmin-vo2max-trend]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/date-vo2max.test.mjs
      - run: npm run build
