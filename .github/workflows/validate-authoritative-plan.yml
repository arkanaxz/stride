name: Validate authoritative SM2SM replacement
on:
  push:
    branches: [fix/replace-active-plan-from-latest-workbook]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/authoritative-plan.test.mjs
      - run: npm run build
