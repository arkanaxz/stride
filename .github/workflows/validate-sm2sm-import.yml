name: Validate SM2SM safe import
on:
  push:
    branches: [fix/safe-sm2sm-plan-import]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/merge-plan.test.mjs
      - run: npm run build
