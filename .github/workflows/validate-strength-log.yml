name: Verify dashboard routing and strength workout logging
on:
  push:
    branches:
      - master
      - work/strength-log-validation
      - work/strength-history-browsing
jobs:
  strength-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/strength-log-static.test.mjs
      - run: node --experimental-strip-types --test tests/strength-history-browsing.test.mjs
      - run: npm run build
      - run: node tests/smoke-strength-log.mjs
      - run: SMOKE_LIBSQL=1 node tests/smoke-strength-log.mjs
